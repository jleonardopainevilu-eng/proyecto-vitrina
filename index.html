<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrina Digital - Catálogo Comercial</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js" defer></script>
  <script src="ads-config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="main-header">
    <div class="logo">Mi Vitrina</div>
    <input type="text" id="search-input" placeholder="Buscar productos...">
  </header>

  <main class="container">
    <aside class="sidebar">
      <h3>Categorías</h3>
      <ul id="categories-list">
        <li data-category="all" class="active">Todos</li>
      </ul>
    </aside>

    <section class="products-grid" id="products-container">
      <!-- Los productos se cargarán dinámicamente -->
    </section>
  </main>

  <aside id="ad-banner" class="ad-container"></aside>

  <footer>
    <p>&copy; 2026 Mi Vitrina. <a href="terminos.html">Términos y Condiciones</a></p>
  </footer>
</body>
</html>
